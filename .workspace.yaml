# .workspace.yaml — Warpforge project configuration
name: warpforge

services:
  # Landing/docs site (Astro + Tailwind v4). Runs from the www/ subdir.
  web:
    # astro dev ignores $PORT, so pass the allocated port explicitly.
    command: cd www && bun run dev -- --force --port $PORT
    port: 4321
    # env:
    #   DATABASE_URL: postgres://localhost:${db.port}/mydb
    # healthcheck:
    #   url: http://localhost:${web.port}/api/health
    #   interval: 5s

  # Static fixture pages for the agent browser benchmark (bench/browser/README.md).
  browser-bench:
    command: python3 -u -m http.server $PORT --bind 127.0.0.1 --directory bench/browser/site
    port: 4390
    portFallback: auto
    readyPattern: Serving HTTP

